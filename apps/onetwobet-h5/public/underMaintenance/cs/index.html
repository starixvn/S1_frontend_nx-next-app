                    domain => !!url.match(domain)

                        startTime.getUTCDate(),
                        startTime.getUTCHours(),
                        startTime.getUTCMinutes(),
                        startTime.getUTCSeconds()
                    )
                )
                let GMT =
                    '（' +
                    startTime_UTC.toString().slice(25, 29) +
                    startTime_UTC.toString().slice(30, 31) +
                    '）'
                endTime.setUTCSeconds(UTCTimeEnd)
                let endTime_UTC = new Date(
                    Date.UTC(
                        endTime.getUTCFullYear(),
                        endTime.getUTCMonth(),
                        endTime.getUTCDate(),
                        endTime.getUTCHours(),
                        endTime.getUTCMinutes(),
                        endTime.getUTCSeconds()
                    )
                )
                let time = document.getElementsByClassName('time')[0]
                time.innerText =
                    startTime_UTC.toLocaleTimeString('default', {
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false,
                    }) +

                    endTime_UTC.toLocaleTimeString('default', {
